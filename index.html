<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Magazin Online - Produse populare</title>
    <link rel="stylesheet" href="assets/bootstrap.min.css">
</head>
<body class="m-0 p-3" style="--bs-body-bg: #7fd2c6; --bs-body-font-family: Arial, sans-serif;">
    <main>
        <h1 class="text-center fw-bold mb-0" style="color: #bc7b34; font-size: 2rem;">Tech store</h1>

        <div class="container-fluid d-flex flex-wrap justify-content-center align-items-center gap-4 gap-md-5 p-4">
            <article class="card text-center p-2 rounded-4" style="width: 170px; --bs-card-bg: #fff; --bs-card-border-color: #ccc;">
                <img class="w-100 object-fit-cover rounded-1" height="120"
                     src="https://cdn-dynmedia-1.microsoft.com/is/image/microsoftcorp/b00-Surface-Laptop-Intel-8Ed-HD-Front"
                     alt="Laptop Microsoft Surface">
                <div class="card-body p-0">
                    <h2 class="card-title mt-2 mb-1 fw-bold" style="font-size: 18px;">Laptop</h2>
                    <p class="fw-bold mb-3" style="color: #543fa0;">4500 lei</p>
                    <button type="button" class="btn fw-bold px-3 py-2" aria-label="Buy Laptop"
                            style="--bs-btn-bg: #ff8d2a; --bs-btn-color: #000; --bs-btn-hover-bg: #ffae63; --bs-btn-hover-color: #000; --bs-btn-active-bg: #ffae63;">Buy</button>
                </div>
            </article>

            <article class="card text-center p-2 rounded-4" style="width: 170px; --bs-card-bg: #fff; --bs-card-border-color: #ccc;">
                <img class="w-100 object-fit-cover rounded-1" height="120"
                     src="https://store.storeimages.cdn-apple.com/1/as-images.apple.com/is/airpods-max-select-202409-blue_FV1_FMT_WHH?wid=752&amp;hei=636&amp;fmt=jpeg&amp;qlt=90&amp;.v=azQxRkVJKzd6V3J0aGNqWFhLMzBmaVZsckZUTTZZd1pFb3lRTGNlYkF0ZlNUZEVteXB4OGtOTGhSTmh3RHRTQ3dQTEIyc09DUm9TWDdZcEFPT0ZaeFlKWlgzZzdyUXEzcGE2bUxYbWVvdG80S0tTQUJUZml1aUtXL21qMVFpaXQ"
                     alt="Căști Apple AirPods Max">
                <div class="card-body p-0">
                    <h2 class="card-title mt-2 mb-1 fw-bold" style="font-size: 18px;">Headphones</h2>
                    <p class="fw-bold mb-3" style="color: #543fa0;">350 lei</p>
                    <button type="button" class="btn fw-bold px-3 py-2" aria-label="Buy Headphones"
                            style="--bs-btn-bg: #ff8d2a; --bs-btn-color: #000; --bs-btn-hover-bg: #ffae63; --bs-btn-hover-color: #000; --bs-btn-active-bg: #ffae63;">Buy</button>
                </div>
            </article>

            <article class="card text-center p-2 rounded-4" style="width: 170px; --bs-card-bg: #fff; --bs-card-border-color: #ccc;">
                <img class="w-100 object-fit-cover rounded-1" height="120"
                     src="https://centresouq.com/cdn/shop/collections/Untitled_design_4.jpg?v=1760091988"
                     alt="Telefon">
                <div class="card-body p-0">
                    <h2 class="card-title mt-2 mb-1 fw-bold" style="font-size: 18px;">Phone</h2>
                    <p class="fw-bold mb-3" style="color: #543fa0;">1400 lei</p>
                    <button type="button" class="btn fw-bold px-3 py-2" aria-label="Buy Phone"
                            style="--bs-btn-bg: #ff8d2a; --bs-btn-color: #000; --bs-btn-hover-bg: #ffae63; --bs-btn-hover-color: #000; --bs-btn-active-bg: #ffae63;">Buy</button>
                </div>
            </article>
        </div>
    </main>
</body>
</html>
